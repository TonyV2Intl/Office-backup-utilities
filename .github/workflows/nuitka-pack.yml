name: Nuitka Package Release

on:
  workflow_dispatch:
    inputs:
      programs:
        description: 'Programs to package (comma-separated list, e.g. :OfficebackupSingle5.1.py,Officebackup5.1Core.py)'
        required: true
      version:
        description: 'Version number to use for the build (e.g.: 5.1)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x64'
    
    - name: Install Visual Studio Build Tools 2015
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.0
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U nuitka==1.9.5 Pillow<=9.5.0 pystray<=0.19.4 pywin32<=306 alist3<=1.5.0
    
    - name: Package programs with Nuitka
      run: |
        $programs = "${{ github.event.inputs.programs }}".Split(",") | ForEach-Object { $_.Trim() }
        $version = "${{ github.event.inputs.version }}"
        foreach ($program in $programs) {
          if (Test-Path $program) {
            Write-Host "Packaging $program with version $version..."
            # Use --disable-dll-dependency-cache to handle dependency walker issues in Nuitka 1.9.5
            python -m nuitka --standalone --follow-imports --python-flag="-S" --main="$program" --remove-output --windows-icon-from-ico="PythonLight.ico" --file-version="$version" --product-name="Office-Backup-Utilities" --company-name="TonyV2Intl" --product-version="$version" --copyright="Copyright (C) 2026 TonyV2Intl" --onefile --include-data-files="./PythonLight.ico=./PythonLight.ico" --msvc=14.0 --disable-dll-dependency-cache
          } else {
            Write-Warning "File $program not found, skipping..."
          }
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-packages
        path: |
          *.exe
          *.zip
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      uses: AButler/upload-release-assets@v3.0
      with:
        files: "*.exe"
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        release-tag: v${{ github.event.inputs.version }}
