name: Nuitka Package Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      programs:
        description: 'Programs to package (comma-separated list, e.g. OfficebackupSingle5.1.py,Officebackup5.1Core.py)'
        required: true
      version:
        description: 'Version number to use for the build (e.g., 5.1)'
        required: true
        default: '5.1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x64'
    
    - name: Install Visual Studio Build Tools 2015
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.0
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use Nuitka 2.3.0
        pip install -U nuitka==2.3.0 Pillow<=9.5.0 pystray<=0.19.4 pywin32<=306 alist3<=1.5.0
    
    - name: Download Dependency Walker manually
      run: |
        # Create cache directory for Nuitka
        $cacheDir = "C:\Users\runneradmin\AppData\Local\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
        New-Item -ItemType Directory -Path $cacheDir -Force
        
        # Download Dependency Walker
        Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile "$cacheDir\depends.zip"
        
        # Extract the zip file
        Expand-Archive -Path "$cacheDir\depends.zip" -DestinationPath $cacheDir -Force
        
        # Verify the files exist
        Get-ChildItem -Path $cacheDir
    
    - name: Package programs with Nuitka
      run: |
        $programs = "${{ github.event.inputs.programs }}".Split(",") | ForEach-Object { $_.Trim() }
        $version = "${{ github.event.inputs.version }}"
        foreach ($program in $programs) {
          if (Test-Path $program) {
            Write-Host "Packaging $program with version $version..."
            python -m nuitka --standalone --follow-imports --python-flag="-S" --main="$program" --remove-output --windows-icon-from-ico="PythonLight.ico" --file-version="$version" --product-name="Office-Backup-Utilities" --company-name="TonyV2Intl" --product-version="$version" --copyright="Copyright (C) 2026 TonyV2Intl" --onefile --include-data-files="./PythonLight.ico=./PythonLight.ico" --msvc=14.0
          } else {
            Write-Warning "File $program not found, skipping..."
          }
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-packages
        path: |
          *.exe
          *.zip
