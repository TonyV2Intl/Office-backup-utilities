name: Nuitka Packaging (Main Program)

on:
  workflow_dispatch:
    inputs:
      programs:
        description: 'Programs to package (comma-separated list, e.g. :Officebackup6.0.py,Officebackup6.0Core.py)'
        required: true
      version:
        description: 'Version number to use for the build (must be a tuple of up to 4 integer values, e.g. 6.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python (3.8, x64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x64'
    
    - name: Install Visual Studio Build Tools 2015 (14.0)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U nuitka==1.9.5
        pip install -r requirements.txt
    
    - name: Package programs with Nuitka
      run: |
        $programs = "${{ github.event.inputs.programs }}".Split(",") | ForEach-Object { $_.Trim() }
        $version = "${{ github.event.inputs.version }}"
        foreach ($program in $programs) {
          if (Test-Path $program) {
            Write-Host "Packaging $program with version $version..."
            python -m nuitka --standalone --follow-imports --python-flag="-S" --main="$program" --remove-output --windows-icon-from-ico="PythonLight.ico" --file-version="$version" --product-name="Office-Backup-Utilities" --company-name="TonyV2Intl" --product-version="$version" --copyright="Copyright (C) 2026 TonyV2Intl" --onefile --include-data-files="./PythonLight.ico=./PythonLight.ico" --msvc=14.0
          } else {
            Write-Warning "File $program not found, skipping..."
          }
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-packages
        path: |
          *.exe
          *.zip